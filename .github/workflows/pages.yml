name: Pages

# Publish the web app to GitHub Pages after the tests pass on main.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the tests ran on (workflow_run otherwise checks out main's latest).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Copy the web app, without its tests
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/tests
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
