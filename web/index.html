<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow Maze</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #d4d4d8;
      --accent: #2563eb;
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #18181b;
        --panel: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --accent: #60a5fa;
        --error: #f87171;
      }
    }
    :root[data-theme="dark"] {
        --bg: #18181b;
        --panel: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --accent: #60a5fa;
        --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    form {
      max-width: 420px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      gap: 20px;
    }
    label { display: grid; gap: 6px; font-weight: 600; }
    label small { font-weight: 400; color: var(--muted); }
    input[type=number] {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .row { display: flex; justify-content: space-between; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #error { margin: 0; color: var(--error); min-height: 1.5em; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    #info { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); font-size: 0.875rem;
    }
    .chip i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #888; }
    .meta { color: var(--muted); font-size: 0.875rem; }
    canvas { display: block; max-width: 100%; image-rendering: pixelated; }
    .hint { color: var(--muted); font-size: 0.875rem; margin: 0 0 12px; }
    .hint kbd {
      font: inherit; font-size: 0.8rem; padding: 0 6px;
      border: 1px solid var(--border); border-radius: 4px; background: var(--panel);
    }
    #moves { font-weight: 600; color: var(--text); margin-left: 8px; }
    dialog {
      min-width: 280px; max-width: calc(100vw - 32px);
      padding: 24px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--panel); color: var(--text);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.5); }
    dialog h2 { margin: 0 0 8px; font-size: 1.25rem; }
    dialog p { margin: 0 0 20px; color: var(--muted); }
    dialog .actions { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <main>
    <section id="setup">
      <h1>Rainbow Maze</h1>
      <p class="sub">Start at the X in the upper right and find your way to the circle in the bottom left.</p>
      <form id="setup-form">
        <label>
          Maze size (squares per side)
          <input id="size" type="number" value="100" step="1" required>
          <small>Between <span id="size-range"></span>.</small>
        </label>
        <label>
          <span class="row">Number of colors <span id="colors-value"></span></span>
          <input id="colors" type="range" min="1" value="7" step="1">
          <small id="colors-hint"></small>
        </label>
        <p id="error" role="alert"></p>
        <button class="primary" type="submit">Create maze</button>
      </form>
    </section>

    <section id="maze" hidden>
      <div class="toolbar">
        <button id="back" type="button">← Change settings</button>
        <button id="again" class="primary" type="button">New maze</button>
        <button id="download" type="button">Download JSON</button>
      </div>
      <div id="info"></div>
      <p class="hint">Move with <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> · <kbd>Esc</kbd> for menu <span id="moves"></span></p>
      <canvas id="canvas"></canvas>
    </section>
  </main>

  <dialog id="pause-menu">
    <h2>Paused</h2>
    <p>Press Esc again to resume.</p>
    <div class="actions">
      <button id="resume" class="primary" type="button" autofocus>Resume</button>
      <button id="pause-main" type="button">Main menu</button>
    </div>
  </dialog>

  <dialog id="win-menu">
    <h2>You made it!</h2>
    <p id="win-text"></p>
    <div class="actions">
      <button id="win-again" class="primary" type="button" autofocus>New maze</button>
      <button id="win-main" type="button">Main menu</button>
    </div>
  </dialog>
  <script src="maze.js"></script>
  <script src="app.js"></script>
</body>
</html>
